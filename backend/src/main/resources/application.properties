spring.application.name=cupcake-store

server.port=8080

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/cupcake_store}
spring.datasource.username=${DATABASE_USERNAME:cupcake}
spring.datasource.password=${DATABASE_PASSWORD:cupcake123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
